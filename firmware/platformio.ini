; ── CLAMPEL firmware ────────────────────────────────────
; ESP32-C3 SuperMini + one WS2812D-F5 on GPIO4.
;
; `pio run` builds. FIRST FLASH ONLY: `pio run -t upload`. After that, update
; with `clampel flash` (host/clampel.py). Once the USB-download eFuse is
; burned, `-t upload` can no longer reach the lamp, by design.

; Without this, `pio run -t upload` would process every env and leave the
; rollback-test image on the lamp.
[platformio]
default_envs = clampel

[env:clampel]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino

; USB Serial/JTAG as `Serial`. The C3 has no USB-OTG, so there is no TinyUSB and no
; way to name the device: it is always 303A:1001 "USB JTAG/serial debug
; unit". The lamp is identified by its USB serial number (= MAC) instead.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCLAMPEL_VERSION=\"1.1.3\"

; Default Arduino partition table: two OTA app slots (app0/app1). The serial
; self-update writes the slot that isn't running, and the bootloader rolls back
; if the new image never checks in.
board_build.partitions = default.csv

; Resolve the upload port from lamp.json's USB serial number, never by
; autodetect. Autodetect would happily flash lamp firmware onto whichever
; other C3 is on the bench.
extra_scripts = pre:lamp_port.py

monitor_speed = 115200

; Proves the safety net before the eFuse is burned: this image never confirms
; itself, so after `pio run -e rollback-test` and
; `clampel flash .pio/build/rollback-test/firmware.bin` the
; bootloader must drop back to the previous image within ~30 s.
[env:rollback-test]
extends = env:clampel
build_flags =
    ${env:clampel.build_flags}
    -DCLAMPEL_ROLLBACK_TEST
